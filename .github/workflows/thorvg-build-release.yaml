name: Build ThorVG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ThorVG tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thorvg-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          # - os: windows-2022
          #   platform: windows
          #   arch: x86_64
          # - os: windows-11-arm
          #   platform: windows
          #   arch: arm64
    uses: ./.github/workflows/thorvg-build.yaml
    with:
      tag: ${{ inputs.tag }}
      os: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}

  release:
    name: Publish all bundles
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: thorvg-*
          path: artifacts
          merge-multiple: true

      - name: Generate artifact bundle index
        env:
          TAG: ${{ inputs.tag }}
        run: python Scripts/ci.py --index

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "thorvg-build-$TAG" artifacts/*.artifactbundle.zip artifacts/*.artifactbundleindex \
            --target "$GITHUB_SHA" \
            --title "ThorVG $TAG build" \
            --generate-notes
