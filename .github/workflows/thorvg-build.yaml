name: Build ThorVG target

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      os:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }}-${{ inputs.arch }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: thorvg/thorvg
          ref: ${{ inputs.tag }}
          path: thorvg

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja
        run: python -m pip install meson ninja

      - name: Configure
        working-directory: thorvg
        run: meson setup build "-Dengines=cpu,gl" -Dstatic=true -Dbuildtype=release -Ddefault_library=static -Dbindings=capi

      - name: Build
        working-directory: thorvg
        run: meson compile -C build

      - name: Package
        env:
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
        run: python Scripts/ci.py

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: thorvg-${{ inputs.platform }}-${{ inputs.arch }}
          path: artifacts/*.artifactbundle.zip
          if-no-files-found: error
